<script src="Jquery.js"></script>
    <script>
      $(function(){
        $(".btn1").click(function(){
          $("p").fadeOut();
        })
        $(".btn2").click(function(){
          $("p").fadeIn();
        })
      })
    </script>
  </head>
  <body>
   <p>ການນຳໃຊ້ fadeIn ເເລະ fadeOut</p>
    <button class="btn1">fadeIn</button>
    <button class="btn2">fadeOut</button>
  </body>
</html>
