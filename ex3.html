<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Jquery.js"></script>
    <script>
      $(function(){
        $(".btn1").click(function(){
            $("p").fadeOut();
        })
        $(function(){
            $(".btn2").click(function(){
                $("p").fadeIn();
            })
        })
      })
    </script>
</head>
<body>
    <p> ການນຳໃຊ້ fadeIn ເເລະ fadeOut </p>
<button clss="btn1">fadeIn</button>
<button clss="btn2">fadeOut</button>
</body>
</html>
