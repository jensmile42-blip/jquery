<!doctype html>
<html lang="lo">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <script src="Jquery.js"></script>
    <script>
      $(function () {
        $(".b1").hide() 
        $(".btn1").click(function () {
          if ($(".b1").is(":hidden")) {
            $(".a1").fadeOut();
            $(".b1").fadeIn();
          } else $(".b1").fadeOut();
        });
        $(".btn2").dblclick(function(){
          $(".a1,.b1").fadeIn();
        })
        $(".btn1").hover(
          function(){
            $(this).css({"background-color":"green","font-size":"20px"});
            $(".btn2").fadeTo("slow",0);
          },
          function(){
            $(this).css({"background-color":"","font-size":"16px"});
            $(".btn2").fadeTo("slow",1);
          },
        );
        $(".btn2").hover(
          function(){
          $(this).css({"background-color":"blue","font-size":"20px"});
          $(".btn1").fadeTo("slow",0);
        },
          function(){
          $(this).css({"backgound-color":"","font-size":"20px"});
          $(".btn1").fadeTo("slow",0);
        }
        );
      });
    </script>
  </head>
  <body>
    <h3 class="a1">ຄ່ອຍໆຫາຍໄປ</h3>
    <h3 class="b1">ຄ່ອຍໆສະເເດງອອກມາ</h3>
    <button type="button" class="btn1">ຄຮິກຄັ້ງດຽວ</button>
    <button type="button" class="btn2">ຄຮິກສອງຄັ້ງ</button>
  </body>
</html>
