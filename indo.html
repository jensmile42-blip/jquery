<!doctype html>
<html lang="lo">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <script src="Jquery.js"></script>
    <script>
      $(function () {
        $(".b1").hide() 
        $(".btn1").click(function () {
          if ($(".b1").is(":hidden")) {
            $(".a1").fadeOut();
            $(".b1").fadeIn();
          } else $(".b1").fadeOut();
        });
        $(".btn2").dblclick(function(){
          $(".a1,.b1").fadeIn();
        })
        $(".btn1").hover(
          function(){
            $(this).css({"background-color":"green","font-size":"20px"});
            $(".btn2").fadeTo("slow",0);
          },
          function(){
            $(this).css({"background-color":"","font-size":"16px"});
            $(".btn2").fadeTo("slow",1);
          },
        );
        $(".btn2").hover(
          function(){
          $(this).css({"background-color":"blue","font-size":"20px"});
          $(".btn1").fadeTo("slow",0);
        },
          function(){
          $(this).css({"backgound-color":"","font-size":"20px"});
          $(".btn1").fadeTo("slow",0);
        }
        );
      });
    </script>
  </head>
  <body>	<img src="ຊື່ ນາມສະກຸນ" width="300" height="300"></img>
	<button type="button" id =" slideup">ເລືອນຂື້ນ</button>
	<button type="button"id =" slidedown">ເລືອນລົງ</button>
<button type="button" id ="slideToggle">ເລືອນຂື້ນ ເເລະ ເລືອນລົງ</button>
  </body>
</html>
