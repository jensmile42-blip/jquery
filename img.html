<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Jquery.js"></script>
    <script>
        $(function(){
            $("$slideup").click(function(){
                $("img").slideUp();
                
            })
            $("#slidedown").click(function(){
                $("img").slideDown();
            })
            $("#slideToggle").click(function(){
                $("img").slideToggle();
            })
        })
    </script>
</head>
<body>
    	<img src="photo/WhatsApp Image 2026-11-20 at 11.12.19 (2).jpeg" width="300" height="300"></img>
	<button type="button" id =" slideup">ເລືອນຂື້ນ</button>
	<button type="button"id =" slidedown">ເລືອນລົງ</button>
<button type="button" id ="slideToggle">ເລືອນຂື້ນ ເເລະ ເລືອນລົງ</button>
</body>
</html>
